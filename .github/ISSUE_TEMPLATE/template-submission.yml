name: 在线投稿一个模板或模块
description: 不会写代码也能先提交创意；通过初审后，维护者或智能体会协助生成 PR
title: "[投稿] "
labels: ["community", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢共建 OneBench。请只提交一种最小贡献类型；不懂 GitHub 或代码也没关系，先把用户、效果和截图说清楚即可。
        投稿不应包含真实姓名、账目、令牌、Cookie、私人日程或未经授权的图片。
  - type: dropdown
    id: kind
    attributes:
      label: 投稿类型
      options:
        - 职业包（身份 + 主题 + 模块 + 首用示例）
        - 布局模板（组件顺序与尺寸）
        - 主题包（只改变外观）
        - 模块组合（复用已有模块）
        - 单模块（新增独立能力）
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 投稿名称
      placeholder: 例如：新手教师的一周备课台
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: 适合谁
      placeholder: 例如：第一次准备考研、需要手机使用的大学生
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 用户第一次打开能完成什么
      placeholder: 请用小白能看懂的话说明，不要只写功能名。
    validations:
      required: true
  - type: textarea
    id: contents
    attributes:
      label: 默认模块、布局或主题内容
      placeholder: 列出首页组件、侧栏应用、示例数据及哪些内容可编辑。
    validations:
      required: true
  - type: textarea
    id: interactions
    attributes:
      label: 每个模块如何使用
      description: 说明哪些内容由用户填写、哪些自动计算、哪些联网更新；不能只放不可操作的展示卡片。
      placeholder: 例如：课程由用户编辑；下次上课倒计时自动计算；天气每 30 分钟更新并保留离线缓存。
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 桌面和手机截图
      description: 可直接拖入图片。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 源码或设计稿（可选）
      description: 已经做出代码、JSON、Figma 或在线演示时填写链接；只有创意可以留空。
      placeholder: https://github.com/你的账号/仓库 或设计稿链接
  - type: textarea
    id: network
    attributes:
      label: 联网、权限与断网方案
      placeholder: 没有联网能力请写“无”；有则说明数据源、权限和缓存方式。
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 投稿确认
      options:
        - label: 所有示例条目都允许用户修改或删除
          required: true
        - label: 自动内容会显示来源、更新时间和失败后的替代内容
          required: true
        - label: 不包含口令、令牌、私人数据或无法授权的素材
          required: true
        - label: 同意通过开源 PR 接受审阅与后续维护
          required: true
